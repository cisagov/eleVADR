---
ci:
  # Do not commit changes from running pre-commit for pull requests.
  autofix_prs: false
  # Autoupdate hooks weekly (this is the default).
  autoupdate_schedule: weekly

default_install_hook_types:
  - pre-commit
  - commit-msg

default_language_version:
  # force all unspecified python hooks to run python3
  python: python

repos:
  # Check the pre-commit configurations
  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-json
        exclude: >-
          ^backend/regression/fixtures/05_parser_edge_cases/(weird|modbus)\.json$
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-xml
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args:
          - --allow-missing-credentials
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: pretty-format-json
        args:
          - --autofix
        exclude: >-
          (^.*lock\.json$|^backend/regression/fixtures/05_parser_edge_cases/(weird|modbus)\.json$)
      - id: trailing-whitespace
      - id: check-added-large-files
        args:
          - --maxkb=500

  # Text file hooks
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: e72a3ca1632f0b11a07d171449fe447a7ff6795e
    hooks:
      - id: markdownlint
        args:
          - --disable=MD013
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 515f543f5718ebfd6ce22e16708bb32c68ff96e1
    hooks:
      - id: prettier
        stages:
          - pre-commit

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530
    hooks:
      - id: yamllint
        args:
          - --strict

  # GitHub Actions hooks
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: f805888065fdb6162e1f800e50bb9460cbd223d6
    hooks:
      - id: check-github-actions
      - id: check-github-workflows

  # pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit
    rev: f35134b05028ec938ac605ae500fdf95462655d3
    hooks:
      - id: validate_manifest

  # Shell script hooks
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 05c1426671b9237fb5e1444dd63aa5731bec0dfb
    hooks:
      - id: shfmt
        args:
          # List files that will be formatted
          - --list
          # Write result to file instead of stdout
          - --write
          # Indent by two spaces
          - --indent
          - "2"
          # Binary operators may start a line
          - --binary-next-line
          # Switch cases are indented
          - --case-indent
          # Redirect operators are followed by a space
          - --space-redirects
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95
    hooks:
      - id: shellcheck

  # General checks (commits, spelling)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8
    hooks:
      - id: conventional-pre-commit
        stages:
          - commit-msg
        args: []

  - repo: https://github.com/codespell-project/codespell
    rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a
    hooks:
      - id: codespell
        args:
          - --skip=*.json,*.csv,*lock*,*.min*
          - --ignore-words-list=OT,ot,covert,contextA,localY,mot,THA,doubleClick

  - repo: local
    hooks:
      - id: docker-compose-check
        name: Validate Docker Compose files
        entry: python validate_docker_compose.py
        language: system
        files: ^docker-compose(\.mongodb)?\.yml$
        pass_filenames: false
        require_serial: true

      - id: text-encoding-check
        name: Validate text encoding
        entry: python validate_text_encoding.py
        language: system
        pass_filenames: false
        files: ^(frontend|backend|docs|sample_data)/

      - id: eslint
        name: ESLint
        files: frontend/
        entry: pnpm --dir frontend run lint
        language: system
        types_or:
          - ts
          - tsx
        pass_filenames: false
      - id: typescript-check
        name: TypeScript Check
        files: frontend/
        entry: pnpm --dir frontend run type-check
        language: system
        pass_filenames: false
