# eleVADR MongoDB configuration (Community Edition, standalone).
# Mounted into the image at /etc/mongod.conf and passed with --config.

storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # Cap the cache so the database does not take memory from the rest of the stack.
      cacheSizeGB: 0.25

net:
  port: 27017
  # The container network is the boundary. The compose file publishes the port on
  # loopback only, and the Kubernetes Service is ClusterIP.
  bindIp: 0.0.0.0
  maxIncomingConnections: 100
  ipv6: false

security:
  authorization: enabled
  # No application code uses $where, $function, $accumulator or mapReduce.
  javascriptEnabled: false

setParameter:
  enableLocalhostAuthBypass: false
  authenticationMechanisms: SCRAM-SHA-256

# Logs go to the console (the default) so the container runtime collects them.
systemLog:
  quiet: true

operationProfiling:
  mode: "off"
  slowOpThresholdMs: 200
