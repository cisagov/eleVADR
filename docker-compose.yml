---

name: elevadr-orchestration

services:
  elevadr-web-backend:
    image: docker.io/cisagov/elevadr-web-backend:develop
    cap_drop:
      - ALL
    container_name: elevadr-web-backend
    read_only: true
    tmpfs:
      - /tmp
    environment:
      ELEVADR_MODE: api
      API_PORT: 8000
      FRONTEND_ORIGIN: http://localhost:8080,http://127.0.0.1:8080
      SSL_CERT_FILE: ${SSL_CERT_FILE}
      REQUESTS_CA_BUNDLE: ${REQUESTS_CA_BUNDLE}
      CURL_CA_BUNDLE: ${CURL_CA_BUNDLE}
    ports:
      - 127.0.0.1:8000:8000
    restart: unless-stopped
    networks:
      - elevadr-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 4GB
        reservations:
          memory: 512MB

  elevadr-web-frontend:
    image: docker.io/cisagov/elevadr-frontend:develop
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    container_name: elevadr-web-frontend
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    environment:
      SSL_CERT_FILE: ${SSL_CERT_FILE}
      CURL_CA_BUNDLE: ${CURL_CA_BUNDLE}
    ports:
      - 127.0.0.1:8080:80
    restart: unless-stopped
    networks:
      - elevadr-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:80/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      elevadr-web-backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512MB
        reservations:
          memory: 200MB

networks:
  elevadr-network:
    driver: bridge
