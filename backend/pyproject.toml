[project]
name = "Elevadr-Backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.139.2 ; python_full_version >= '3.10'",
    "numpy==2.5.1",
    "pandas==3.0.3 ; python_full_version >= '3.11'",
    "uvicorn[standard]>=0.49.0",
    "zat>=0.4.9",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.6.0",
    "pre-commit>=4.6.0",
    "pyarrow>=24.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-mock>=3.15.1",
    "python-multipart==0.0.32",
]

docs = [
    "sphinx>=9.1.0",
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx-js>=5.0.3",
    "sphinx-autodoc-typehints>=3.12.1",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.deptry]
extend_exclude = [".*tests.*"]

[tool.deptry.per_rule_ignores]
DEP001 = ["app", "src", "backend"]
DEP002 = ["uvicorn"]

[tool.elevadr]
image_name = "cisagov/elevadr-backend"
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["tests"]

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort, B = flake8-bugbear,
# UP = pyupgrade, N = pep8-naming, D = pydocstyle
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["E203", "E501", "D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["backend/tests/", "backend/src/app/data/"]
explicit_package_bases = true

[tool.codespell]
skip = "*.json,*.csv,*lock*,*.min*"
ignore-words-list = "OT"

[tool.markdownlint-cli]
default = true
MD003 = { "style" = "atx_closed" }
MD004 = { "style" = "dash" }
MD013 = { "code_blocks" = false, "tables" = false, "line_length" = 120 }
MD024 = { "allow_different_nesting" = true }
MD029 = { "style" = "one" }
MD033 = { "allowed_elements" = ["h1", "img"] }
MD035 = { "style" = "---" }
MD050 = { "style" = "asterisk" }

[tool.bandit]
tests = ["B102"]
skips = ["B104", "B108", "B404", "B603", "B607", "B310"]
