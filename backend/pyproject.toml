[project]
name = "Elevadr-Backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.136.3 ; python_full_version >= '3.10'",
    "numpy>=2.3.5",
    "pandas==3.0.3 ; python_full_version >= '3.11'",
    "uvicorn[standard]>=0.49.0",
    "zat>=0.4.9",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "httpx2>=2.3.0",
    "pre-commit>=4.6.0",
    "pyarrow>=24.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "python-multipart>=0.0.27",
]

[tool.deptry]
extend_exclude = [".*tests.*"]

[tool.deptry.per_rule_ignores]
DEP001 = ["app", "src", "backend"]
DEP002 = ["uvicorn"]

[tool.elevadr]
image_name = "cisagov/elevadr-web-backend"
platforms = [
    "linux/amd64",
    "linux/arm64",
]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["tests"]

[tool.ruff.lint]
# E = pycodestyle, F = Pyflakes, I = isort, B = flake8-bugbear,
# UP = pyupgrade, N = pep8-naming, D = pydocstyle
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["E203", "E501", "D203", "D213"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = ["backend/tests/", "backend/src/app/data/"]
explicit_package_bases = true

[tool.codespell]
skip = "*.json,*.csv,*lock*,*.min*"
ignore-words-list = "OT"
