<!doctype html><html lang="en"><meta charset="utf-8"><title>eleVADR SVG rendering benchmark</title><style>body{font:14px system-ui;margin:24px}svg{width:100%;height:420px;border:1px solid #aaa}table{border-collapse:collapse}td,th{padding:6px 12px;border:1px solid #aaa}</style><h1>eleVADR browser SVG workload benchmark</h1><p>Standalone synthetic SVG workload. This measures browser DOM/SVG insertion and paint scheduling, not React or real eleVADR graph layout.</p><button id="run">Run benchmark</button><table><thead><tr><th>Nodes</th><th>Edges</th><th>DOM build (ms)</th><th>Two-frame paint proxy (ms)</th><th>Longest frame gap (ms)</th></tr></thead><tbody id="results"></tbody></table><svg id="graph" viewBox="0 0 1000 600"></svg><script>
const sizes=[[100,500],[500,2500],[1000,5000],[2500,10000]];
const svg=document.getElementById('graph'), results=document.getElementById('results');
const frame=()=>new Promise(resolve=>requestAnimationFrame(resolve));
async function run(){document.getElementById('run').disabled=true;results.textContent='';const summary=[];for(const [nodes,edges] of sizes){svg.replaceChildren();await frame();const t0=performance.now();const frag=document.createDocumentFragment();let seed=1234567;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};const coords=Array.from({length:nodes},()=>[rand()*1000,rand()*600]);for(let i=0;i<edges;i++){const a=coords[Math.floor(rand()*nodes)],b=coords[Math.floor(rand()*nodes)];const e=document.createElementNS('http://www.w3.org/2000/svg','line');e.setAttribute('x1',a[0]);e.setAttribute('y1',a[1]);e.setAttribute('x2',b[0]);e.setAttribute('y2',b[1]);e.setAttribute('stroke','#8a8a8a');frag.append(e)}for(const [x,y] of coords){const n=document.createElementNS('http://www.w3.org/2000/svg','circle');n.setAttribute('cx',x);n.setAttribute('cy',y);n.setAttribute('r',3);n.setAttribute('fill','#316e98');frag.append(n)}svg.append(frag);const built=performance.now();await frame();const f1=performance.now();await frame();const f2=performance.now();const row=[nodes,edges,(built-t0).toFixed(1),(f2-built).toFixed(1),Math.max(f1-built,f2-f1).toFixed(1)];const tr=document.createElement('tr');for(const val of row){const td=document.createElement('td');td.textContent=val;tr.append(td)}results.append(tr);summary.push(row)}window.__elevadrBenchmark=summary;document.getElementById('run').disabled=false}document.getElementById('run').onclick=run;if(new URLSearchParams(location.search).has('auto'))run();
</script></html>
