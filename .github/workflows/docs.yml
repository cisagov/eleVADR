---
name: Deploy Sphinx Docs

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - develop

permissions:
  contents: write

env:
  UV_CACHE_DIR: /home/runner/.cache/uv
  PNPM_CACHE_DIR: /home/runner/.cache/pnpm
  NODE_VERSION: "22"
  PNPM_VERSION: "11"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: backend/pyproject.toml

      - id: setup-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: 0.11.11
          enable-cache: false

      - name: Install dependencies
        run: |
          uv sync --directory backend/
          uv sync --group docs --directory backend/

      - id: setup-pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: ${{ env.PNPM_VERSION }}
      - id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile -C frontend/

      - name: Build HTML
        run: |
            # -b html: build target
            # docs/: source directory
            # docs/_build/html: output directory
            source backend/.venv/bin/activate
            sphinx-build -b html docs/source docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
