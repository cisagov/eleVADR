---
name: Provide repository metadata

on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      component:
        description: Which component to read metadata for (backend or frontend)
        required: true
        type: string
    outputs:
      image-name:
        description: The name of the Docker image.
        value: ${{ jobs.output-repo-metadata.outputs.image-name }}
      image-platforms:
        description: The supported platforms for the Docker image.
        value: ${{ jobs.output-repo-metadata.outputs.image-platforms }}

jobs:
  output-repo-metadata:
    name: Generate outputs for repository metadata
    outputs:
      image-name: ${{ steps.set-outputs.outputs.image-name }}
      image-platforms: ${{ steps.set-outputs.outputs.image-platforms }}
    permissions: {}
    runs-on: ubuntu-latest
    env:
      COMPONENT: ${{ inputs.component }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Set outputs for repository metadata
        id: set-outputs
        run: |
          import json
          import os
          import sys
          # Python 3.11+ for tomllib, otherwise use 'pip install tomli'
          try:
              import tomllib
          except ImportError:
              import tomli as tomllib

          component = os.environ["COMPONENT"]
          config_file = "pyproject.toml" if component == "backend" else "package.json"

          # Ensure the script runs from the repo root
          # (In Actions, this is the default)
          config_path = os.path.join(component, config_file)
          if not os.path.exists(config_path):
              print(f"Error: {config_path} not found.")
              sys.exit(1)

          with open(config_path, "rb") as f:
              if component == "backend":
                config = tomllib.load(f)
              else:
                config = json.load(f)

          # Read from the config file
          image_name = config["tool"]["elevadr"]["image_name"]
          image_platforms = config["tool"]["elevadr"]["platforms"]

          # Write to GitHub Outputs
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh_output:
              gh_output.write(f"image-name={image_name}\n")
              gh_output.write(f"image-platforms={json.dumps(image_platforms)}\n")
        shell: python3 {0}
