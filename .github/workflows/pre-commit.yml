---
name: pre-commit

on: # yamllint disable-line rule:truthy
  merge_group:
    types:
      - checks_requested
  # We use the default activity types for the pull_request event as specified here:
  # https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
  pull_request:
  push:
    branches-ignore:
      - dependabot/**

# Set a default shell for any run steps. The `-Eueo pipefail` sets errtrace,
# nounset, errexit, and pipefail. The `-x` will print all commands as they are
# run.
defaults:
  run:
    shell: bash -Eueo pipefail -x {0}

env:
  PIP_CACHE_DIR: /home/runner/.cache/pip
  PRE_COMMIT_CACHE_DIR: /home/runner/.cache/pre-commit
  RUN_TMATE: ${{ secrets.RUN_TMATE }}

jobs:
  diagnostics:
    name: Run diagnostics
    # This job does not need any permissions
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      # Note that a duplicate of this step must be added at the top of
      # each job.
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          check_github_status: "true"
          monitor_permissions: "false"
          output_workflow_context: "true"
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}

  pre-commit:
    name: Run pre-commit hooks
    needs:
      - diagnostics
    permissions:
      # actions/checkout needs this to fetch code
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Apply standard cisagov job preamble
        uses: cisagov/action-job-preamble@v1
        with:
          monitor_permissions: "false"
          permissions_monitoring_config: ${{ vars.ACTIONS_PERMISSIONS_CONFIG }}

      - id: setup-env
        uses: cisagov/setup-env-github-action@v1

      - uses: actions/checkout@v6

      # ---- Python toolchain (for deptry, mypy, bandit, ruff, uv-audit) ----
      - id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - id: setup-uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.11
          enable-cache: false

      - name: Install backend Python dependencies
        working-directory: ./backend
        run: uv sync

      # Deptry needs to be installed separately because it would require
      # `uv run deptry` in the pre-commit.
      - name: Install Deptry as tool
        run: uv tool install deptry

      # ---- Node toolchain (for eslint, typescript-check) ----
      - id: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11"

      - id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend Node dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      # ---- pre-commit ----
      - name: Cache pip and pre-commit environments
        uses: actions/cache@v5
        env:
          BASE_CACHE_KEY: >-
            ${{ github.job }}-${{ runner.os }}-py${{
            steps.setup-python.outputs.python-version }}-
        with:
          key: >-
            ${{ env.BASE_CACHE_KEY }}${{
            hashFiles('.pre-commit-config.yaml') }}
          path: |
            ${{ env.PIP_CACHE_DIR }}
            ${{ env.PRE_COMMIT_CACHE_DIR }}
          restore-keys: |
            ${{ env.BASE_CACHE_KEY }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Set up pre-commit hook environments
        run: pre-commit install-hooks

      - name: Run pre-commit on all files
        run: pre-commit run --all-files

      - name: Setup tmate debug session
        uses: mxschmitt/action-tmate@v3
        if: env.RUN_TMATE
