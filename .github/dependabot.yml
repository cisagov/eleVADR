---

updates:
  - directory: /
    package-ecosystem: docker
    schedule:
      interval: weekly

  - directory: /
    package-ecosystem: docker-compose
    schedule:
      interval: weekly

  - directory: /
    package-ecosystem: github-actions
    schedule:
      interval: weekly

  - directory: /backend
    package-ecosystem: uv
    schedule:
      interval: daily

  - directory: /frontend
    package-ecosystem: npm
    schedule:
      interval: daily

version: 2
